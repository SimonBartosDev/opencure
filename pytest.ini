[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --tb=short
    -ra
markers =
    integration: tests requiring full DRKG/data — slow (>5s)
    slow: tests >30s
    network: tests requiring external network access
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
